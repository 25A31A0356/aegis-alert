<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#04070c" />
    </linearGradient>

    <!-- Component Box Gradient -->
    <linearGradient id="chip-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141f32" />
      <stop offset="100%" stop-color="#0d1522" />
    </linearGradient>

    <!-- Solar & Power Gradient -->
    <linearGradient id="power-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1b0a" />
      <stop offset="100%" stop-color="#191005" />
    </linearGradient>

    <!-- Filter for Glow Effects -->
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Outfit', sans-serif; font-weight: 800; fill: #f8fafc; font-size: 22px; }
    .subtitle { font-family: 'Outfit', sans-serif; font-size: 13px; fill: #94a3b8; }
    .box-title { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 15px; fill: #38bdf8; }
    .pin-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #cbd5e1; }
    .wire-data { stroke: #38bdf8; stroke-width: 2; fill: none; }
    .wire-power-12v { stroke: #ef4444; stroke-width: 2.5; fill: none; }
    .wire-power-5v { stroke: #f59e0b; stroke-width: 2; fill: none; }
    .wire-power-3v3 { stroke: #10b981; stroke-width: 1.8; fill: none; }
    .wire-gnd { stroke: #64748b; stroke-width: 2; stroke-dasharray: 4,3; fill: none; }
    .legend-text { font-family: 'Outfit', sans-serif; font-size: 12px; fill: #94a3b8; }
  </style>

  <!-- Canvas Background -->
  <rect width="1100" height="700" fill="url(#bg-grad)" rx="12" stroke="#1e293b" stroke-width="2" />

  <!-- Diagram Header -->
  <g transform="translate(40, 45)">
    <text class="title">AEGISBEACON™ AUTONOMOUS HARDWARE NODE SCHEMATIC</text>
    <text y="22" class="subtitle">Zero-Internet Embedded Circuit Architecture • ESP32 + LoRa SX1262 + Solar/LiFePO4 + 120dB Siren</text>
  </g>

  <!-- ========================================================================
       POWER SUBSYSTEM (LEFT)
       ======================================================================== -->
  <!-- Solar Panel -->
  <rect x="50" y="110" width="180" height="90" rx="8" fill="url(#power-grad)" stroke="#f59e0b" stroke-width="1.5" />
  <text x="65" y="135" class="box-title" fill="#f59e0b">☀️ SOLAR PANEL (30W)</text>
  <text x="65" y="155" class="pin-label">Voc: 21.6V • Isc: 1.8A</text>
  <text x="65" y="175" class="pin-label">Monocrystalline 12V</text>

  <!-- Solar MPPT Controller & LiFePO4 -->
  <rect x="50" y="240" width="180" height="120" rx="8" fill="url(#chip-grad)" stroke="#f59e0b" stroke-width="1.5" />
  <text x="65" y="265" class="box-title" fill="#f59e0b">🔋 CHARGE CONTROLLER</text>
  <text x="65" y="285" class="pin-label">CN3791 MPPT Solar</text>
  <text x="65" y="305" class="pin-label">LiFePO4 4S (12.8V 6Ah)</text>
  <text x="65" y="325" class="pin-label">Over-discharge Protect</text>
  <text x="65" y="345" class="pin-label">Output: 12V DC Rail</text>

  <!-- DC-DC Buck Converter (12V to 5V / 3.3V) -->
  <rect x="50" y="400" width="180" height="85" rx="8" fill="url(#chip-grad)" stroke="#10b981" stroke-width="1.5" />
  <text x="65" y="425" class="box-title" fill="#10b981">⚡ DC-DC STEP DOWN</text>
  <text x="65" y="445" class="pin-label">LM2596 / MP2307</text>
  <text x="65" y="465" class="pin-label">5.0V (Relays) &amp; 3.3V (MCU)</text>

  <!-- ========================================================================
       CORE CONTROLLER: ESP32 (CENTER)
       ======================================================================== -->
  <rect x="330" y="170" width="260" height="340" rx="10" fill="url(#chip-grad)" stroke="#38bdf8" stroke-width="2" filter="url(#glow-blue)" />
  <text x="355" y="205" class="box-title" font-size="18">🧠 ESP32-WROOM-32D</text>
  <text x="355" y="225" class="subtitle">240MHz Dual Core • Deep Sleep Ready</text>

  <!-- Left Pins of ESP32 (Power & LoRa SPI) -->
  <text x="345" y="260" class="pin-label">3V3 ─── Power In</text>
  <text x="345" y="285" class="pin-label">GND ─── Ground</text>
  <text x="345" y="315" class="pin-label">IO5  ─── LoRa NSS (CS)</text>
  <text x="345" y="340" class="pin-label">IO18 ── LoRa SCK</text>
  <text x="345" y="365" class="pin-label">IO19 ── LoRa MISO</text>
  <text x="345" y="390" class="pin-label">IO23 ── LoRa MOSI</text>
  <text x="345" y="415" class="pin-label">IO26 ── LoRa DIO0 (IRQ)</text>
  <text x="345" y="440" class="pin-label">IO14 ── LoRa RESET</text>
  <text x="345" y="480" class="pin-label">IO34 ── ADC Battery Sense</text>

  <!-- Right Pins of ESP32 (Actuators & Audio) -->
  <text x="470" y="260" class="pin-label">IO27 ── Relay 1 (Siren)</text>
  <text x="470" y="285" class="pin-label">IO25 ── Relay 2 (Strobe)</text>
  <text x="470" y="315" class="pin-label">IO16 ── DFPlayer RX</text>
  <text x="470" y="340" class="pin-label">IO17 ── DFPlayer TX</text>
  <text x="470" y="370" class="pin-label">IO22 ── MAX7219 CLK</text>
  <text x="470" y="395" class="pin-label">IO21 ── MAX7219 DIN</text>
  <text x="470" y="420" class="pin-label">IO15 ── MAX7219 CS</text>
  <text x="470" y="460" class="pin-label">Status LED (Heartbeat)</text>

  <!-- ========================================================================
       RF COMMUNICATIONS: LORA SX1262 (TOP RIGHT)
       ======================================================================== -->
  <rect x="330" y="40" width="260" height="90" rx="8" fill="url(#chip-grad)" stroke="#38bdf8" stroke-width="1.5" />
  <text x="350" y="65" class="box-title">📡 LoRa RF MODULE (SX1262)</text>
  <text x="350" y="85" class="pin-label">868.1 MHz ISM Band • +22dBm ERP</text>
  <text x="350" y="105" class="pin-label">SPI Interface to ESP32 • Range: 25km</text>

  <!-- Antenna -->
  <path d="M 590 85 L 640 85 L 640 50 M 625 50 L 655 50 M 632 40 L 648 40" stroke="#38bdf8" stroke-width="2" fill="none" />
  <text x="650" y="65" class="pin-label">868MHz 5dBi Omni Antenna</text>

  <!-- ========================================================================
       ACTUATORS & LIFE-SAVING HARDWARE (FAR RIGHT)
       ======================================================================== -->
  <!-- 2-Channel Relay Module -->
  <rect x="680" y="170" width="160" height="110" rx="8" fill="url(#chip-grad)" stroke="#a855f7" stroke-width="1.5" />
  <text x="695" y="195" class="box-title" fill="#a855f7">🔌 OPTICAL RELAYS</text>
  <text x="695" y="215" class="pin-label">5V Optocoupler 10A</text>
  <text x="695" y="235" class="pin-label">Ch 1: 12V Siren Power</text>
  <text x="695" y="255" class="pin-label">Ch 2: 12V Strobe Power</text>

  <!-- 120dB Acoustic Siren -->
  <rect x="880" y="150" width="170" height="85" rx="8" fill="url(#chip-grad)" stroke="#ef4444" stroke-width="2" filter="url(#glow-red)" />
  <text x="895" y="175" class="box-title" fill="#ef4444">📢 120dB SIREN HORN</text>
  <text x="895" y="195" class="pin-label">12V 1.5A Acoustic Driver</text>
  <text x="895" y="215" class="pin-label">Audible Range: 2 to 3 km</text>

  <!-- 360 Strobe Array -->
  <rect x="880" y="255" width="170" height="85" rx="8" fill="url(#chip-grad)" stroke="#f59e0b" stroke-width="2" />
  <text x="895" y="280" class="box-title" fill="#f59e0b">🚨 360° STROBE ARRAY</text>
  <text x="895" y="300" class="pin-label">48x High-Flux Red/Amber</text>
  <text x="895" y="320" class="pin-label">Visual Fog / Night Flash</text>

  <!-- DFPlayer Mini Voice Synthesizer & Audio Horn -->
  <rect x="680" y="310" width="160" height="100" rx="8" fill="url(#chip-grad)" stroke="#06b6d4" stroke-width="1.5" />
  <text x="695" y="335" class="box-title" fill="#06b6d4">🔊 VOICE PA MODULE</text>
  <text x="695" y="355" class="pin-label">DFPlayer Mini (UART)</text>
  <text x="695" y="375" class="pin-label">PAM8403 10W Amplifier</text>
  <text x="695" y="395" class="pin-label">Spoken Hindi &amp; English</text>

  <!-- Alphanumeric LED Ticker Display -->
  <rect x="680" y="440" width="370" height="80" rx="8" fill="url(#chip-grad)" stroke="#10b981" stroke-width="1.5" />
  <text x="695" y="465" class="box-title" fill="#10b981">💡 ALPHANUMERIC LED TICKER (MAX7219 4-IN-1)</text>
  <text x="695" y="485" class="pin-label">SPI 3-Wire Interface • Ultra-High Contrast Amber Dot Matrix</text>
  <text x="695" y="505" class="pin-label">Displays: Shelter Locations, Evacuation Directives, River Heights</text>

  <!-- ========================================================================
       WIRING CONNECTIONS
       ======================================================================== -->
  <!-- Solar to Charger -->
  <path d="M 140 200 L 140 240" class="wire-power-12v" />
  <!-- Charger to Buck -->
  <path d="M 140 360 L 140 400" class="wire-power-12v" />
  <!-- Buck 3.3V to ESP32 -->
  <path d="M 230 440 L 280 440 L 280 260 L 330 260" class="wire-power-3v3" />
  <!-- LoRa to ESP32 SPI -->
  <path d="M 460 130 L 460 170" class="wire-data" />
  <!-- ESP32 to Relays -->
  <path d="M 590 270 L 680 270" class="wire-data" />
  <!-- Relays to Siren -->
  <path d="M 840 210 L 880 210" class="wire-power-12v" />
  <!-- Relays to Strobe -->
  <path d="M 840 270 L 880 270" class="wire-power-12v" />
  <!-- ESP32 to Voice PA -->
  <path d="M 590 330 L 680 330" class="wire-data" />
  <!-- ESP32 to LED Matrix -->
  <path d="M 590 470 L 680 470" class="wire-data" />

  <!-- ========================================================================
       FOOTER & LEGEND
       ======================================================================== -->
  <g transform="translate(50, 630)">
    <rect width="1000" height="45" rx="6" fill="#0c121d" stroke="#1e293b" />
    <text x="25" y="28" class="legend-text" font-weight="700">WIRING LEGEND:</text>
    
    <line x1="140" y1="24" x2="175" y2="24" class="wire-power-12v" />
    <text x="185" y="28" class="legend-text">12V Battery Rail</text>

    <line x1="310" y1="24" x2="345" y2="24" class="wire-power-5v" />
    <text x="355" y="28" class="legend-text">5V Relays / Audio</text>

    <line x1="480" y1="24" x2="515" y2="24" class="wire-power-3v3" />
    <text x="525" y="28" class="legend-text">3.3V Logic Rail</text>

    <line x1="640" y1="24" x2="675" y2="24" class="wire-data" />
    <text x="685" y="28" class="legend-text">SPI / UART / GPIO</text>

    <line x1="820" y1="24" x2="855" y2="24" class="wire-gnd" />
    <text x="865" y="28" class="legend-text">Common Ground</text>
  </g>
</svg>
